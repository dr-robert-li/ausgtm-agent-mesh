# Local infra for ausgtm-agent-mesh.
#
# Assumptions (revisit before any non-local deployment):
#   - Single-node Postgres with the pgvector extension preinstalled.
#     `pgvector/pgvector:pg16` is the canonical image and ships the
#     extension; we still `CREATE EXTENSION` in init scripts to be explicit.
#   - Temporal auto-setup image is the standard local-dev posture. It is
#     NOT suitable for production. Production target is a self-hosted
#     Temporal cluster on AWS ECS Fargate.
#   - Networking is bridged on the default compose network; the API and
#     workers run on the host and talk to these services via localhost.
#   - Data volumes are named so `docker compose down -v` is the explicit
#     reset path.
#
# Bring up:  docker compose -f infra/local/docker-compose.yml up -d
# Tear down: docker compose -f infra/local/docker-compose.yml down
# Reset:     docker compose -f infra/local/docker-compose.yml down -v

name: ausgtm-mesh

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ausgtm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ausgtm_mesh}
      POSTGRES_USER: ${POSTGRES_USER:-ausgtm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ausgtm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ausgtm} -d ${POSTGRES_DB:-ausgtm_mesh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Temporal needs its own Postgres for persistence. Keep it separate from the
  # app DB so a `down -v` on app data doesn't wipe workflow history (and
  # vice-versa).
  temporal-postgres:
    image: postgres:16
    container_name: ausgtm-temporal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.0
    container_name: ausgtm-temporal
    restart: unless-stopped
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.0
    container_name: ausgtm-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"

volumes:
  postgres_data:
  temporal_postgres_data:
