[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ausgtm-agent-mesh"
version = "0.1.0"
description = "Local-first Python POC runtime for the Agentic Mesh (tracks agentic-mesh-reference-arch v0.1.2)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "dr-robert-li", email = "dr.robert.li.au@gmail.com" },
]
keywords = ["agentic-mesh", "temporal", "anthropic", "mcp", "slack", "fastapi"]

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Orchestration
    "temporalio>=1.7",

    # Slack
    "slack-bolt>=1.21",
    "slack-sdk>=3.32",

    # MCP
    "mcp>=1.2",

    # Persistence
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",

    # HTTP / clients
    "httpx>=0.27",

    # Model providers
    "anthropic>=0.39",
    # Bedrock / Vertex are optional extras — see [project.optional-dependencies].

    # Observability
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "structlog>=24.1",

    # ULIDs for Task IDs per reference-arch
    "python-ulid>=2.7",
]

[project.optional-dependencies]
bedrock = [
    "boto3>=1.34",
]
vertex = [
    "google-cloud-aiplatform>=1.60",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests",
    "respx>=0.21",
    "freezegun>=1.5",
]

[project.urls]
Homepage = "https://github.com/dr-robert-li/ausgtm-agent-mesh"
ReferenceArchitecture = "https://github.com/dr-robert-li/agentic-mesh-reference-arch"

# -----------------------------------------------------------------------------
# Hatch packaging — explicitly include both the apps/ and packages/ trees.
# -----------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.hatch.build.targets.sdist]
include = [
    "apps",
    "packages",
    "infra",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "CLAUDE.md",
    ".env.example",
]

# -----------------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps", "packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # asserts ok in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

# -----------------------------------------------------------------------------
# Mypy
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^build/", "^dist/"]

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: pure unit tests",
    "contract: pydantic / JSON-schema contract tests",
    "workflow: Temporal workflow tests using the SDK test harness",
    "integration: real external services (Slack/Monday/Sheets/tl;dv sandboxes)",
    "dynamic: Swarm Supervisor behaviour (waves, recursion, spawn ledger)",
    "system: full end-to-end Slack→API→Temporal→tools→Slack",
    "chaos: failure injection and recovery",
    "observability: reconstruct a task tree from the five log streams",
    "slow: long-running tests excluded from default runs",
]
