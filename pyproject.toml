[project]
name = "agent-mesh"
version = "0.3.0"
description = "Reusable, governed autonomous agent mesh POC (LangChain/LangGraph/Deep Agents/Langfuse on GCP, Cloudflare AI Gateway, LiteLLM-compatible model gateway)."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Heavier runtime deps are optional so the contract/schema layer and tests can
# run in a minimal environment. The worker/ingress images install the full set.
runtime = [
    "google-cloud-pubsub>=2.21",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "mcp>=1.2",
    "slack-bolt>=1.18",
    "litellm>=1.40",
    "langchain-litellm>=0.6",
    # langfuse 4.x is the installed/validated line; the v2 import path is DEAD
    # under 4.x (03-RESEARCH). Pin the major to keep the trace API stable.
    "langfuse>=4,<5",
    # OpenTelemetry: HTTP OTLP exporter only (gRPC is intentionally NOT a dep —
    # 03-RESEARCH Pitfall 5). Consumed by 03-02/03-03 trace wiring.
    "opentelemetry-api>=1.42",
    "opentelemetry-sdk>=1.42",
    "opentelemetry-exporter-otlp-proto-http>=1.42",
]
# Default REQUIRED agent stack for this variant: LangChain + LangGraph +
# Deep Agents. The orchestration adapter degrades to a deterministic stub when
# these are not installed so the POC stays importable and testable.
# Pins verified current (02-RESEARCH Standard Stack): langchain 1.x, langgraph 1.x,
# both checkpoint backends (consumed by 02-02 — pinned now so 02-02 never edits
# pyproject), and deepagents 0.6.8. LangSmith is NEVER a dependency (CLAUDE.md §1).
agents = [
    "langchain>=1.0",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres~=3.1",
    "langgraph-checkpoint-sqlite~=3.1",
    "deepagents~=0.6.8",
]
# GUI admin / operator app.
gui = [
    "streamlit>=1.36",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mesh"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# The default suite is the deterministic stub lane (no provider/Postgres/Langfuse
# creds). The `live` marker tags opt-in tests that need real provider/gateway
# credentials; run them with `pytest -m live` (see `make test-live`). NOTE:
# filterwarnings is intentionally NOT set to `error` — the langchain pydantic-v1
# Py-3.14 UserWarning must stay a warning, never an error, or the green-suite
# invariant breaks.
markers = [
    "live: opt-in test requiring real provider/gateway credentials (never in the default suite)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic.
    "UP042",  # str+Enum is intentional: yields clean JSON/value serialization under Pydantic.
]
