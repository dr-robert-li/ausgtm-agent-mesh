[project]
name = "agent-mesh"
version = "0.3.0"
description = "Reusable, governed autonomous agent mesh POC (LangChain/LangGraph/Deep Agents/Langfuse on GCP, Cloudflare AI Gateway, LiteLLM-compatible model gateway)."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Heavier runtime deps are optional so the contract/schema layer and tests can
# run in a minimal environment. The worker/ingress images install the full set.
runtime = [
    "google-cloud-pubsub>=2.21",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "mcp>=1.2",
    "slack-bolt>=1.18",
    "litellm>=1.40",
    "langchain-litellm>=0.1",
    "langfuse>=2.0",
]
# Default REQUIRED agent stack for this variant: LangChain + LangGraph +
# Deep Agents. The orchestration adapter degrades to a deterministic stub when
# these are not installed so the POC stays importable and testable.
agents = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "deepagents>=0.0.2",
]
# GUI admin / operator app.
gui = [
    "streamlit>=1.36",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mesh"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic.
    "UP042",  # str+Enum is intentional: yields clean JSON/value serialization under Pydantic.
]
