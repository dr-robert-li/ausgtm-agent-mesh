# Reusable Autonomous Agent Mesh deployment manifest
# (LangChain + LangGraph + Deep Agents + Langfuse variant).
# Copy this file per client/environment, then fill values before running scripts.

deployment:
  client_slug: "example-client"
  tenant_id: "tenant-example"
  environment: "poc"
  region: "australia-southeast1"
  project_id: "REPLACE_WITH_GCP_PROJECT_ID"
  create_project_if_missing: false
  billing_account_id: "OPTIONAL_REPLACE_IF_CREATE_PROJECT_TRUE"
  retention_profile: "12_month_audit"

budgets:
  model_monthly_usd: 50
  infra_guardrail_monthly_usd: 65

gcp:
  artifact_registry_repo: "agent-mesh"
  cloud_sql:
    instance_name: "agent-mesh-poc"
    database_name: "agent_mesh"
    tier: "db-g1-small"
    ha_enabled: false
    storage_gb: 20
    backup_enabled: true
  cloud_run:
    ingress_service_name: "agent-mesh-api"
    slack_service_name: "agent-mesh-slack"
    mcp_service_name: "agent-mesh-mcp"
    gui_service_name: "agent-mesh-admin"
    worker_job_name: "agent-mesh-worker"
    prompt_to_code_job_name: "agent-mesh-code-executor"
  pubsub:
    task_topic: "agent-mesh-tasks"
    approval_topic: "agent-mesh-approvals"
    dead_letter_topic: "agent-mesh-dlq"

cloudflare:
  account_id: "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"
  wrangler_env: "poc"
  ai_gateway_id: "agent-mesh-poc"
  reuse_existing_gateway: true
  ai_gateway_wrapper_worker_name: "agent-mesh-ai-gateway-wrapper"
  zero_trust_dlp_profile: "agent-mesh-ai-dlp"
  collect_log_payload_default: false
  guardrails:
    enabled: true
    evaluate_prompts: true
    evaluate_responses: true
    block_on_match: true

# Default required agent + observability stack for this variant. The agent
# fleet logic is provider-agnostic; routes select Anthropic-direct or Vertex AI
# without changing agent code.
stack:
  agent_framework: "langchain+langgraph+deepagents"   # REQUIRED default
  observability: "langfuse"                            # REQUIRED default
  langsmith: "optional-alternative-only"
  model_gateway: "litellm-compatible"                  # routing/budgets/cascades
  cloudflare_ai_gateway: "integration-ready"           # model-traffic governance

model_routes:
  default_profile: "mixed-cascade"
  # provider_mode: anthropic | vertex_ai | mixed. Both paths are first class.
  provider_mode: "mixed"
  profiles:
    mixed-cascade:
      low_complexity:
        preferred: "vertex_ai/gemini-1.5-flash"
        fallback: "vertex_ai/gemini-1.5-pro"
      medium_complexity:
        preferred: "vertex_ai/gemini-1.5-pro"
        fallback: "anthropic/claude-sonnet-4-6"
      high_complexity:
        preferred: "anthropic/claude-sonnet-4-6"
        fallback: "vertex_ai/claude-sonnet-4-6"
    anthropic-direct:
      low_complexity:
        preferred: "anthropic/claude-haiku-4-5"
        fallback: "anthropic/claude-sonnet-4-6"
      medium_complexity:
        preferred: "anthropic/claude-sonnet-4-6"
        fallback: "anthropic/claude-haiku-4-5"
      high_complexity:
        preferred: "anthropic/claude-sonnet-4-6"
        fallback: "anthropic/claude-sonnet-4-6"

ingress:
  slack:
    enabled: true
    signing_secret_secret_name: "SLACK_SIGNING_SECRET"
    bot_token_secret_name: "SLACK_BOT_TOKEN"
  mcp:
    enabled: true
    server_base_url: "https://mcp.example.com/mcp"
    auth_mode: "oauth_resource_server"
    # MCP clients with mirrored capabilities. Claude Desktop / Claude Code first;
    # Codex, OpenCode, and Pi connect later via the same MCP/tool boundary.
    clients:
      claude_desktop: true
      claude_code: true
      codex: false
      opencode: false
      pi: false
  gui_admin:
    enabled: true
    # Streamlit operator console: tasks, approvals, toolpack/MCP registries,
    # AI-BOM, budget/model routing, memory/context, self-improvement proposals,
    # deployment checks, Langfuse trace links/health.
    auth_mode: "iap"

tool_packs:
  manifest_path: "manifests/tool_pack_manifest.yaml"
  # Integration styles supported per tool: direct API, individual MCP server,
  # aggregate MCP server, or integration aggregator (e.g. Nango).
  integration_styles: ["direct_api", "mcp_server", "aggregate_mcp", "nango_aggregator"]

observability:
  platform: "langfuse"            # REQUIRED default for this variant
  langfuse_enabled: true
  langfuse_self_hosted: false     # set true to self-host Langfuse
  langsmith_enabled: false        # optional alternative only; not required
  cloudflare_ai_gateway_enabled: true
  otel_service_name: "agent-mesh"
  log_payloads:
    model_payloads: false
    tool_payloads: true
