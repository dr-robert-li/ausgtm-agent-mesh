  # ---------------- Xero (financial — via Composio aggregator) ----------------
  # Xero rides the EXISTING composio.py adapter (verb-agnostic session.execute),
  # so no new Xero module and no nango.py edit. Aggregate tools get NO schema
  # refs (D-04 permissive/runtime branch validates against the runtime provider
  # schema). Composio brokers the Xero OAuth + tenant.
  - name: "xero_read_invoices"
    provider: "xero"
    integration_style: "composio_aggregator"
    category: "read"
    description: "Read invoices/contacts for financial context."
    approval_required: false
    credential_secret_name: "COMPOSIO_API_KEY"
    resource_bindings:
      tool_slug: "XERO_LIST_INVOICES"
      user_id: "mesh-tenant-example"
    freshness_sla: "1h"
    rate_limit_notes: "Respect Xero API rate limits."

  - name: "xero_create_invoice"
    provider: "xero"
    integration_style: "composio_aggregator"
    category: "financial"
    description: "Create a draft Xero invoice (never auto-finalised)."
    approval_required: true
    credential_secret_name: "COMPOSIO_API_KEY"
    resource_bindings:
      tool_slug: "XERO_CREATE_INVOICE"
      user_id: "mesh-tenant-example"
    freshness_sla: "live"
    rate_limit_notes: "Respect Xero API rate limits."

