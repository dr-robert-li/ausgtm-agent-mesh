    input_schema_ref: "schemas/webflow_list_cms_items.input.schema.json"
    output_schema_ref: "schemas/webflow_list_cms_items.output.schema.json"
    freshness_sla: "15m"
    rate_limit_notes: "Respect Webflow API rate limits."

  - name: "webflow_create_cms_item"
    provider: "webflow"
    integration_style: "direct_api"
    category: "publishing"
    description: "Create a Webflow CMS collection item (draft)."
    approval_required: true
    credential_secret_name: "WEBFLOW_API_TOKEN"
    resource_bindings:
      site_id: "REPLACE_WITH_SITE_ID"
      collection_id: "REPLACE_WITH_COLLECTION_ID"
    input_schema_ref: "schemas/webflow_create_cms_item.input.schema.json"
    output_schema_ref: "schemas/webflow_create_cms_item.output.schema.json"
    freshness_sla: "live"
    rate_limit_notes: "Respect Webflow API rate limits."

  # ---------------- Bitscale (read + write) ----------------
  # Real direct httpx adapter: base https://api.bitscale.ai/api/v1, X-API-Key.
  # Reads (list_grids, get_workspace) are credit-free; run_grid is a write that
  # consumes the client's paid credits → approval-gated AND stubbed even in the
  # live lane (credit-safety). Ops match the wave-2 _BITSCALE_OPS dispatch keys.
  - name: "bitscale_list_grids"
    provider: "bitscale"
    integration_style: "direct_api"
    category: "read"
    description: "List Bitscale grids (credit-free) for grounding/evidence."
    approval_required: false
    credential_secret_name: "BITSCALE_API_KEY"
    resource_bindings:
      grid_id: "REPLACE_WITH_BITSCALE_GRID_ID"
    input_schema_ref: "schemas/bitscale_list_grids.input.schema.json"
    output_schema_ref: "schemas/bitscale_list_grids.output.schema.json"
    freshness_sla: "1h"
    rate_limit_notes: "Respect Bitscale workspace limits."

  - name: "bitscale_get_workspace"
    provider: "bitscale"
    integration_style: "direct_api"
    category: "read"
    description: "Read Bitscale workspace details (plan, credits, members) — credit-free."
    approval_required: false
    credential_secret_name: "BITSCALE_API_KEY"
    input_schema_ref: "schemas/bitscale_get_workspace.input.schema.json"
    output_schema_ref: "schemas/bitscale_get_workspace.output.schema.json"
    freshness_sla: "1h"
    rate_limit_notes: "Respect Bitscale workspace limits."

  - name: "bitscale_run_grid"
    provider: "bitscale"
    integration_style: "direct_api"
    category: "write"
    description: "Run a Bitscale grid (appends a row + triggers enrichment) — consumes paid credits."
    approval_required: true
    credential_secret_name: "BITSCALE_API_KEY"
    resource_bindings:
      grid_id: "REPLACE_WITH_BITSCALE_GRID_ID"
    input_schema_ref: "schemas/bitscale_run_grid.input.schema.json"
    output_schema_ref: "schemas/bitscale_run_grid.output.schema.json"
    freshness_sla: "live"
    rate_limit_notes: "Respect Bitscale workspace limits; run_grid burns paid credits."

