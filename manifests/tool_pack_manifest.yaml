    description: "Create a Beehiiv newsletter post draft (never auto-published)."
    approval_required: true
    credential_secret_name: "BEEHIIV_API_KEY"
    resource_bindings:
      publication_id: "REPLACE_WITH_PUBLICATION_ID"
    freshness_sla: "live"
    rate_limit_notes: "Respect Beehiiv API limits."
